name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Core + dev extras, plus lightgbm for the supervised detector test.
      # The heavier ML/deep/agents/db stacks are not needed by the test suite.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" lightgbm

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Validate configs
        run: python -m energymind.config

      - name: Tests
        run: pytest -q
